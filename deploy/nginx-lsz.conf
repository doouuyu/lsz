# 李时珍智能医师 —— nginx 站点配置
# 放到 /etc/nginx/conf.d/lsz.conf （或 sites-available 软链到 sites-enabled）
# 一个域名同时承载：PC 管理端静态站 + 后端 API 反代 + 报告文件
# 把 taoism.test.doouu.cc 换成你的已备案域名，证书路径换成你的实际路径

# HTTP -> HTTPS 跳转（小程序强制 https）
server {
    listen 80;
    server_name taoism.test.doouu.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name taoism.test.doouu.cc;

    ssl_certificate     /etc/nginx/ssl/taoism.test.doouu.cc.pem;
    ssl_certificate_key /etc/nginx/ssl/taoism.test.doouu.cc.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传化验单/舌诊图片，放宽请求体（后端上限 12M，这里给足余量）
    client_max_body_size 20m;

    # ---- PC 管理端静态站点 ----
    # 放在 /var/www（而非 /root/taoism）：nginx worker 以 www-data 运行，无权进 /root(700)
    root /var/www/taoism/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # Vue history 路由兜底
    }

    # ---- V2 实时语音 WebSocket ----
    location = /api/v2/asr/realtime {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ---- 后端 API 反代 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;            # 大模型/PDF 生成耗时，给足
        proxy_send_timeout 300s;
    }

    # ---- 生成的报告（PDF/HTML），后端 mount 在 /reports ----
    location /reports/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # ---- 健康检查 ----
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
}
